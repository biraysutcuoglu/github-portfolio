name: Update GitHub contributions

on:
  # No schedule: this workflow only runs when the fetcher changes or when
  # triggered manually, so pages only redeploy on real pushes.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-contributions.mjs'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch contributions
        env:
          # GITHUB_TOKEN can read your own private contributions when the
          # workflow runs in your own repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/fetch-contributions.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub contributions [skip ci]"
            git push
          fi
